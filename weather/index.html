<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="full-width">
        <div class="main-container">
            <div class="weather-side flex">
                <div class="date-contaiiner">
                    
                    <h2 class="date-dayname">Friday</h2>
                    <div class="date-day">01 December 2026</div>
                    <i class="fa-solid fa-location-dot"></i>
                    <span class="location">London</span>
                </div>

                <div class="weather-container">
                    <i class="fa-solid fa-sun icon"></i>
                    <h2 class="weather-temp">35&deg;C</h2>
                    <h3 class="weather-desc">Sunny</h3>
                </div>
            </div>

            <div class="info-side">
                <div class="search-container">
                    <input type="search" placeholder="Search for places" class="search-box">
                    <button>Search</button>
                </div>
                <div class="today-info-container">
                    <div class="today-info">
                        <div class="percipitation flex">
                            <!-- বৃষ্টিপাত -->
                            <span class="title">PERCIPITATION</span>
                            <span class="value">0%</span>
                        </div>

                        <div class="humidity flex">
                            <!-- Humidity= বাতাসের আর্দ্রতা।
                             বাতাসে কতটুকু জলীয় বাষ্প -->
                            <span class="title">HUMIDITY</span>
                            <span class="value">34%</span>
                        </div>

                        <div class="wind flex">
                            <!-- বাতাসের গতি -->
                            <span class="title">WIND SPEED</span>   
                            <span class="value">13.3 km/h</span>
                        </div>
                    </div>
                </div>

                <div class="week-container">
                    <ul class="week-list flex">
                        <li class="active">
                            <i class="fa-solid fa-cloud day-icon"></i>
                            <span class="day-name">Tue</span>
                            <span class="day-temp">29&deg;C</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-cloud day-icon"></i>
                            <span class="day-name">Wed</span>
                            <span class="day-temp">25&deg;C</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-cloud day-icon"></i>
                            <span class="day-name">Thu</span>
                            <span class="day-temp">27&deg;C</span>
                        </li>
                        <li>
                            <i class="fa-solid fa-cloud day-icon"></i>
                            <span class="day-name">Fri</span>
                            <span class="day-temp">31&deg;C</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
